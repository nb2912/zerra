version: 1
applications:
  - appRoot: packages/docs
    frontend:
      phases:
        preBuild:
          commands:
            - rm -rf .next
            - npm ci --prefix ../../ --no-audit --no-fund
        build:
          commands:
            - env NEXT_TELEMETRY_DISABLED=1 npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
