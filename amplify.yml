version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - rm -rf packages/docs/.next
            - npm ci --no-audit --no-fund
        build:
          commands:
            - npm run build -w packages/docs
      artifacts:
        baseDirectory: packages/docs/out
        files:
          - '**/*'
      cache:
        paths:
          - packages/docs/.next/cache/**/*
          - node_modules/**/*
